name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Solo valida; el despliegue al Learner Lab está en deploy.yml.
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports: ['8000:8000']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Validate CloudFormation/SAM template
        run: pipx run cfn-lint infra/template.yaml
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:int
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E reservation flow
        run: npm run test:e2e -w @parkfacil/web
        env:
          NEXT_PUBLIC_API_URL: /api
          API_PROXY_TARGET: https://qm7k00c3ie.execute-api.us-east-1.amazonaws.com
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: us-east-1_Vmomy3wX4
          NEXT_PUBLIC_COGNITO_CLIENT_ID: 2574arg5uv33vm6ll8k473pmil
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      - run: npm run build
