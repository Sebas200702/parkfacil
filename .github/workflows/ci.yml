name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Solo valida: el despliegue al Learner Lab es manual porque sus credenciales caducan.
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports: ['8000:8000']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Validate CloudFormation/SAM template
        run: pipx run cfn-lint infra/template.yaml
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:int
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000
      - run: npm run build
